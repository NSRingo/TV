name: Dev
on:
  workflow_call:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  scripts:
    name: Build Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node and Dependencies
        uses: ./.github/actions/setup-node
        with:
          package-token: ${{ secrets.PACKAGE_TOKEN }}
      - name: Build Scripts
        run: npm run build:dev
      - name: Verify Script Bundles
        run: |
          test -s dist/request.dev.bundle.js
          test -s dist/response.dev.bundle.js
          test -s dist/response.lumen.dev.bundle.js
      - name: Test Runtime and Configuration
        run: npm test
      - name: Check Types
        run: npx tsc --noEmit
      - name: Upload Script Bundles
        uses: actions/upload-artifact@v4
        with:
          name: scripts
          path: dist
          if-no-files-found: error

  modules:
    name: Generate Modules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node and Dependencies
        uses: ./.github/actions/setup-node
        with:
          package-token: ${{ secrets.PACKAGE_TOKEN }}
      - name: Generate Modules
        run: npm run build:dev-args
      - name: Verify Generated Modules
        run: |
          test -s dist/iRingo.TV.dev.sgmodule
          test -s dist/iRingo.TV.dev.plugin
          test -s dist/iRingo.TV.dev.snippet
          test -s dist/iRingo.TV.dev.stoverride
          test -s dist/iRingo.TV.dev.boxjs.json
      - name: Upload Modules
        uses: actions/upload-artifact@v4
        with:
          name: modules
          path: dist
          if-no-files-found: error

  package:
    name: Assemble Artifact
    needs: [scripts, modules]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Download Script Bundles
        uses: actions/download-artifact@v4
        with:
          name: scripts
          path: dist
      - name: Download Modules
        uses: actions/download-artifact@v4
        with:
          name: modules
          path: dist
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Verify Complete Artifact
        run: npm run verify:artifacts -- dev
      - name: Upload Complete Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          if-no-files-found: error
          path: |
            CHANGELOG.md
            dist
